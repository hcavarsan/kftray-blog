<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Proxy forward</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap"><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#121212;color:#ebebeb;font-family:Inter,ui-sans-serif,system-ui,sans-serif}.frame{width:960px;max-width:100%;min-width:0;margin:auto}.diagram-container{width:100%;overflow-x:auto}svg{display:block;width:100%;min-width:960px}.diagram-title{font:600 28px Inter,sans-serif;fill:#ebebeb;letter-spacing:-.6px}.node-name{font:600 12px Inter,sans-serif;fill:#ebebeb}.meta,.edge-label,.eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;fill:#999999}.meta{font-size:9px}.edge-label,.eyebrow{font-size:8px;letter-spacing:.4px}.subtitle{font:400 11px Inter,sans-serif;fill:#999999}.legend{font:400 10px Inter,sans-serif;fill:#999999}.node{fill:#2a2a2d;stroke:#3a3a3a;stroke-width:1}.input{fill:#121212;stroke:#999999}.focal{fill:rgba(74,138,245,.125);stroke:#4a8af5}.edge{fill:none;stroke:#999999;stroke-width:1.2}.label-bg{fill:#121212}@media print{body{padding:0}.diagram-container{overflow-x:visible}svg{min-width:0}}</style></head>
<body><main class="frame"><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="workload-proxy-title workload-proxy-desc">
<title id="workload-proxy-title">Proxy forward</title><desc id="workload-proxy-desc">TCP traffic travels from your app through kftray or kftui, the Kubernetes API and kftray-server to a Datadog Agent in the VPC.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#999999"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a8af5"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a8af5"/></marker></defs>
<rect width="960" height="600" fill="#121212"/>
<text x="40" y="40" class="eyebrow">KFTRAY / WORKLOADS</text>
<text x="40" y="76" class="diagram-title">Proxy forward</text>
<text x="40" y="104" class="subtitle">Proxy: yes · Protocol: tcp://</text>
<g data-label="edge-0"><line class="edge" x1="480" y1="196" x2="480" y2="224" marker-end="url(#arrow)"/><rect class="label-bg" x="488" y="202.0" width="32" height="16"/><text class="edge-label" x="496" y="213.0">TCP</text></g>
<g data-label="edge-1"><line class="edge" x1="480" y1="272" x2="480" y2="300" marker-end="url(#arrow)"/><rect class="label-bg" x="488" y="278.0" width="32" height="16"/><text class="edge-label" x="496" y="289.0">TCP</text></g>
<g data-label="edge-2"><line class="edge" x1="480" y1="348" x2="480" y2="376" marker-end="url(#arrow)"/><rect class="label-bg" x="488" y="354.0" width="32" height="16"/><text class="edge-label" x="496" y="365.0">TCP</text></g>
<g data-label="edge-3"><line class="edge" x1="480" y1="424" x2="480" y2="452" marker-end="url(#arrow)"/><rect class="label-bg" x="488" y="430.0" width="32" height="16"/><text class="edge-label" x="496" y="441.0">TCP</text></g>
<g data-node="node-0"><rect x="272" y="148" width="416" height="48" rx="6" fill="#121212"/><rect class="node input" x="272" y="148" width="416" height="48" rx="6"/><text class="node-name" x="480" y="168" text-anchor="middle">Your App</text><text class="meta" x="480" y="184" text-anchor="middle">echo &quot;api.request.count:1|c&quot; | nc 127.0.0.1 8125</text></g>
<g data-node="node-1"><rect x="272" y="224" width="416" height="48" rx="6" fill="#121212"/><rect class="node focal" x="272" y="224" width="416" height="48" rx="6"/><text class="node-name" x="480" y="244" text-anchor="middle">kftray / kftui</text><text class="meta" x="480" y="260" text-anchor="middle">127.0.0.1:8125</text></g>
<g data-node="node-2"><rect x="272" y="300" width="416" height="48" rx="6" fill="#121212"/><rect class="node node" x="272" y="300" width="416" height="48" rx="6"/><text class="node-name" x="480" y="328" text-anchor="middle">Kubernetes API</text></g>
<g data-node="node-3"><rect x="272" y="376" width="416" height="48" rx="6" fill="#121212"/><rect class="node focal" x="272" y="376" width="416" height="48" rx="6"/><text class="node-name" x="480" y="404" text-anchor="middle">kftray-server</text></g>
<g data-node="node-4"><rect x="272" y="452" width="416" height="48" rx="6" fill="#121212"/><rect class="node node" x="272" y="452" width="416" height="48" rx="6"/><text class="node-name" x="480" y="472" text-anchor="middle">Datadog Agent</text><text class="meta" x="480" y="488" text-anchor="middle">10.0.100.50:8125 (VPC)</text></g>
<line x1="40" y1="540" x2="920" y2="540" stroke="#3a3a3a"/><rect x="40" y="556" width="12" height="12" rx="2" fill="#4a8af5"/><text x="60" y="566" class="legend">kftray component</text><line x1="248" y1="562" x2="280" y2="562" class="edge" marker-end="url(#arrow)"/><text x="296" y="566" class="legend">Traffic direction</text>
