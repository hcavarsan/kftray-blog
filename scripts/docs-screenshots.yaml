data:
  version: '0.35.2'
  group_by: null
  configs:
    - alias: api-gateway
      context: prod-eu
      namespace: platform
      service: api-gateway
      local_port: 8080
      remote_port: 80
      protocol: tcp
      http_logs_enabled: true
      running: true
shots:
  - name: http-logging-menu
    window: { width: 600, height: 500 }
    actions:
      - click: { actions: api-gateway }
  - name: git-sync-dialog
    window: { width: 700, height: 700 }
    actions:
      - click: { role: button, name: Configure git sync }
    clip: { role: dialog, name: Configure Github Sync }
